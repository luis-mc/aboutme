<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page not found — Luis Carvalho</title>
  <meta name="robots" content="noindex, follow" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <style>
    :root {
      --navy:    #080c18;
      --navy-2:  #0f1624;
      --gold:    #c9a84c;
      --white:   #f4f4f0;
      --gray:    #8a94a6;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--navy);
      color: var(--white);
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      text-align: center;
    }
    .inner { display: flex; flex-direction: column; align-items: center; gap: 20px; max-width: 520px; }
    .code {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 12px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--gold);
    }
    h1 {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: clamp(2rem, 7vw, 3rem);
      font-weight: 600;
      letter-spacing: -0.01em;
      line-height: 1.1;
    }
    .rule { width: 56px; height: 1px; background: var(--gold); opacity: 0.6; }
    p { color: var(--gray); line-height: 1.65; font-size: 1rem; }
    a.btn {
      margin-top: 8px;
      display: inline-block;
      background: var(--gold);
      color: var(--navy);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      padding: 12px 26px;
      border-radius: 2px;
      transition: opacity 0.2s ease;
    }
    a.btn:hover { opacity: 0.88; }
    a.btn:focus-visible { outline: 2px solid var(--white); outline-offset: 3px; }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  <div class="inner">
    <span class="code">Error 404</span>
    <h1>This page doesn&rsquo;t exist</h1>
    <div class="rule"></div>
    <p>The link may be out of date, or the address slightly off. Everything lives on the main page.</p>
    <a class="btn" href="/">Back to luis-carvalho.com</a>
  </div>
</body>
</html>
